# copy .env.example to .env (repo root) — compose-level vars (release, ports, web build args)
# per-service runtime env is written inline below (x-* anchors hold the shared values)
# then:
#   docker compose up -d --build
# images are tagged pos-cashier/<service>:${RELEASE} (default latest), e.g. RELEASE=1.0.0 docker compose up -d --build
# web needs NODE_AUTH_TOKEN (GitHub Packages, @apisit110/pos-ui) exported in the shell at build time

name: pos-cashier

x-service: &service
  restart: unless-stopped

x-db: &db
  DATABASE_PATH: /data/pos-cashier.db

x-redis: &redis
  REDIS_HOST: redis
  REDIS_PORT: 6379

# shared by every service — used to sign (authen) and verify staff JWTs
x-jwt: &jwt
  JWT_SECRET: ad823f9c58b2beca27a1cbc38b899d8039c9122979fe604b49c3246c4bd994db

# pos-sync-service (pos-center) — merchant credential of provider POS_CASHIER, used when APP_MODE=online
x-sync: &sync
  SYNC_SERVICE_URL: http://host.docker.internal:4002
  SYNC_PARTNER_ID: "0001"
  SYNC_CLIENT_ID: cid_21b91ceb2633bc30e8a0ed6418b909fc
  SYNC_CLIENT_SECRET: cs_2OXHDh1onpyvdwPs3_cfSgkYI31a4DG1fj85yPYUpGk
  SYNC_TID: "0001000101"

x-db-tool: &db-tool
  image: pos-cashier/cashier-authen-service:${RELEASE:-latest}
  # run manually only — never started by a plain `docker compose up`
  profiles: ["db"]
  entrypoint: ["/sbin/tini", "--", "node"]
  environment:
    <<: *db
    # online | offline — offline seeds default staffs/terminal
    APP_MODE: online
  volumes:
    - db-data:/data

services:
  redis:
    <<: *service
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # one-off db tools (reuse the authen image), run by hand before/after deploying:
  #   docker compose run --rm db-migrate
  #   docker compose run --rm db-seed
  db-migrate:
    <<: *db-tool
    command: ["node_modules/@lightning-pos/database/dist/cli/migrate.js"]

  db-seed:
    <<: *db-tool
    command: ["node_modules/@lightning-pos/database/dist/cli/seed.js"]

  cashier-authen-service:
    <<: *service
    image: pos-cashier/cashier-authen-service:${RELEASE:-latest}
    build:
      context: .
      dockerfile: apps/cashier-authen-service/Dockerfile
    environment:
      <<: [*db, *redis, *jwt]
      # online | offline — offline seeds default staffs/terminal
      APP_MODE: online
      # merchant id from pos-center
      MID: "0001"
      # optional — defaults are in the code
      # SYNC_STAFFS_TIMEOUT_MS:
      # SYNC_PULL_DELAY_MS:
    volumes:
      - db-data:/data
    depends_on:
      redis:
        condition: service_healthy

  cashier-members-service:
    <<: *service
    image: pos-cashier/cashier-members-service:${RELEASE:-latest}
    build:
      context: .
      dockerfile: apps/cashier-members-service/Dockerfile
    environment:
      <<: [*db, *jwt]
    volumes:
      - db-data:/data

  cashier-orders-service:
    <<: *service
    image: pos-cashier/cashier-orders-service:${RELEASE:-latest}
    build:
      context: .
      dockerfile: apps/cashier-orders-service/Dockerfile
    environment:
      <<: [*db, *redis, *jwt]
    volumes:
      - db-data:/data
    depends_on:
      redis:
        condition: service_healthy

  cashier-products-service:
    <<: *service
    image: pos-cashier/cashier-products-service:${RELEASE:-latest}
    build:
      context: .
      dockerfile: apps/cashier-products-service/Dockerfile
    environment:
      <<: [*db, *redis, *jwt, *sync]
      # online | offline — offline disables OutboxWorker (no sync attempts to pos-center)
      APP_MODE: online
      # optional — default is in the code
      # SYNC_PRODUCTS_TIMEOUT_MS:
    volumes:
      - db-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      redis:
        condition: service_healthy

  cashier-terminal-service:
    <<: *service
    image: pos-cashier/cashier-terminal-service:${RELEASE:-latest}
    build:
      context: .
      dockerfile: apps/cashier-terminal-service/Dockerfile
    environment:
      <<: [*db, *sync]
      # online | offline — offline seeds the default terminal
      APP_MODE: online
    volumes:
      - db-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway

  cashier-transactions-service:
    <<: *service
    image: pos-cashier/cashier-transactions-service:${RELEASE:-latest}
    build:
      context: .
      dockerfile: apps/cashier-transactions-service/Dockerfile
    environment:
      <<: [*db, *jwt]
    volumes:
      - db-data:/data

  cashier-sync-service:
    # exits 0 on purpose when APP_MODE=offline (worker disabled), so only restart on crash
    restart: on-failure
    image: pos-cashier/cashier-sync-service:${RELEASE:-latest}
    build:
      context: .
      dockerfile: apps/cashier-sync-service/Dockerfile
    environment:
      <<: [*db, *redis, *sync]
      # online | offline — offline disables the BullMQ worker (no sync-order/sync-transaction
      # jobs to pos-center); jobs stay queued in Redis until restarted in online mode
      APP_MODE: online
      # optional — default is in the code
      # SYNC_PULL_DELAY_MS:
    volumes:
      - db-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      redis:
        condition: service_healthy

  cashier-api-gateway:
    <<: *service
    image: pos-cashier/cashier-api-gateway:${RELEASE:-latest}
    build:
      context: .
      dockerfile: apps/cashier-api-gateway/Dockerfile
    environment:
      AUTHEN_SERVICE_URL: http://cashier-authen-service:3005
      MEMBERS_SERVICE_URL: http://cashier-members-service:3004
      ORDERS_SERVICE_URL: http://cashier-orders-service:3002
      PRODUCTS_SERVICE_URL: http://cashier-products-service:3001
      TERMINAL_SERVICE_URL: http://cashier-terminal-service:3007
      TRANSACTIONS_SERVICE_URL: http://cashier-transactions-service:3006
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    depends_on:
      - cashier-authen-service
      - cashier-members-service
      - cashier-orders-service
      - cashier-products-service
      - cashier-terminal-service
      - cashier-transactions-service

  cashier-app:
    <<: *service
    image: pos-cashier/cashier-app:${RELEASE:-latest}
    build:
      context: .
      dockerfile: apps/cashier-app/Dockerfile
      secrets:
        - NODE_AUTH_TOKEN
      args:
        # called from the browser, so it must be reachable from the user's machine (not a compose service name)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api/v1}
        NEXT_PUBLIC_APP_MODE: ${NEXT_PUBLIC_APP_MODE:-online}
    ports:
      - "${WEB_PORT:-3008}:3008"
    depends_on:
      - cashier-api-gateway

secrets:
  NODE_AUTH_TOKEN:
    environment: NODE_AUTH_TOKEN

volumes:
  db-data:
  redis-data:
