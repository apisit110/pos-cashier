name: pos-cashier

x-service: &service
  restart: unless-stopped

x-db: &db
  DATABASE_PATH: /data/pos-cashier.db

x-redis: &redis
  REDIS_HOST: redis
  REDIS_PORT: 6379

x-jwt: &jwt
  JWT_SECRET: ad823f9c58b2beca27a1cbc38b899d8039c9122979fe604b49c3246c4bd994db

x-sync: &sync
  SYNC_SERVICE_URL: http://host.docker.internal:4002
  SYNC_PARTNER_ID: "0001"
  SYNC_CLIENT_ID: cid_6838a5fff9e922ed0b4b47b7ab68975b
  SYNC_CLIENT_SECRET: cs_LFuYb2bG7IhkP5HUgrxEINjNTaFsL7GjsEqbg_TIZ8w
  SYNC_TID: "0001000101"
  # x-origin-secret of the pos-sync-service Function URL (terraform var pos_sync_service_origin_secret), set in .env
  SYNC_ORIGIN_SECRET: ${SYNC_ORIGIN_SECRET:-}

x-db-tool: &db-tool
  image: pos-cashier/cashier-authen-service:${RELEASE:-latest}
  profiles: ["db"]
  entrypoint: ["/sbin/tini", "--", "node"]
  environment:
    <<: *db
    APP_MODE: online
  volumes:
    - db-data:/data

services:
  redis:
    <<: *service
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-migrate:
    <<: *db-tool
    command: ["node_modules/@lightning-pos/database/dist/cli/migrate.js"]

  db-seed:
    <<: *db-tool
    command: ["node_modules/@lightning-pos/database/dist/cli/seed.js"]

  cashier-authen-service:
    <<: *service
    image: pos-cashier/cashier-authen-service:${RELEASE:-latest}
    environment:
      <<: [*db, *redis, *jwt]
      APP_MODE: online
      MID: "0001"
    volumes:
      - db-data:/data
    depends_on:
      redis:
        condition: service_healthy

  cashier-members-service:
    <<: *service
    image: pos-cashier/cashier-members-service:${RELEASE:-latest}
    environment:
      <<: [*db, *jwt]
    volumes:
      - db-data:/data

  cashier-orders-service:
    <<: *service
    image: pos-cashier/cashier-orders-service:${RELEASE:-latest}
    environment:
      <<: [*db, *redis, *jwt]
    volumes:
      - db-data:/data
    depends_on:
      redis:
        condition: service_healthy

  cashier-products-service:
    <<: *service
    image: pos-cashier/cashier-products-service:${RELEASE:-latest}
    environment:
      <<: [*db, *redis, *jwt, *sync]
      APP_MODE: online
    volumes:
      - db-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      redis:
        condition: service_healthy

  cashier-terminal-service:
    <<: *service
    image: pos-cashier/cashier-terminal-service:${RELEASE:-latest}
    environment:
      <<: [*db, *sync]
      APP_MODE: online
    volumes:
      - db-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway

  cashier-transactions-service:
    <<: *service
    image: pos-cashier/cashier-transactions-service:${RELEASE:-latest}
    environment:
      <<: [*db, *jwt]
    volumes:
      - db-data:/data

  cashier-sync-service:
    restart: on-failure
    image: pos-cashier/cashier-sync-service:${RELEASE:-latest}
    environment:
      <<: [*db, *redis, *sync]
      APP_MODE: online
    volumes:
      - db-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      redis:
        condition: service_healthy

  cashier-api-gateway:
    <<: *service
    image: pos-cashier/cashier-api-gateway:${RELEASE:-latest}
    environment:
      AUTHEN_SERVICE_URL: http://cashier-authen-service:3005
      MEMBERS_SERVICE_URL: http://cashier-members-service:3004
      ORDERS_SERVICE_URL: http://cashier-orders-service:3002
      PRODUCTS_SERVICE_URL: http://cashier-products-service:3001
      TERMINAL_SERVICE_URL: http://cashier-terminal-service:3007
      TRANSACTIONS_SERVICE_URL: http://cashier-transactions-service:3006
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    depends_on:
      - cashier-authen-service
      - cashier-members-service
      - cashier-orders-service
      - cashier-products-service
      - cashier-terminal-service
      - cashier-transactions-service

  cashier-app:
    <<: *service
    image: pos-cashier/cashier-app:${RELEASE:-latest}
    ports:
      - "${WEB_PORT:-3008}:3008"
    depends_on:
      - cashier-api-gateway

volumes:
  db-data:
  redis-data:
